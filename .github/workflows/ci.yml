# Fast lane: formatting, type-checks and the vitest suite (unit tests plus the
# HTML approval snapshots). The VS Code extension integration tests live in
# ci-vscode-extension.yml — they need Electron, a virtual display and a VS Code
# download, so keeping them out of this workflow keeps fast feedback fast.

name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vitest 5 / vite 8 require Node ^20.19.0, so pin the Node 20 floor
        # instead of `20.x`, which can resolve below it.
        node-version: ["20.19.0", "22.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      # `npm test` builds @colorful-tmpl/highlight-core first: the suite imports
      # the package by name, so packages/core/dist must exist.
      - name: Unit + approval tests
        run: npm test
